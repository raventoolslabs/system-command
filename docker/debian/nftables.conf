#!/usr/sbin/nft -f
#
# Baseline exigida por README.md de system-command como prerrequisito no
# gestionado por ningún script del repo: tabla inet filter, cadena input
# con política drop, reglas base (loopback, conntrack, ICMP, SSH con
# rate-limit) y un DROP final. host-firewall.sh SOLO añade/retira reglas
# ACCEPT marcadas comment "host-firewall" justo antes del DROP final; nunca
# toca lo que hay aquí.
#
# nftables.service (ExecStart=/usr/sbin/nft -f /etc/nftables.conf) recarga
# este mismo archivo en cada arranque y en cada "systemctl restart
# nftables" — ese es justo el mecanismo que usa provision-broken-state.sh
# para reproducir el bug documentado (flush ruleset borra también la tabla
# de DOCKER-USER).

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        ip protocol icmp accept
        meta l4proto ipv6-icmp accept

        tcp dport 22 ct state new limit rate 10/minute accept comment "ssh-rate-limit"

        drop
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
